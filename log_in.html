<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Orientation</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <header class="section">
        <div class="header-container">
            <h1 class="logo">ORIENTATION</h1>
        </div>
    </header>
    <section id="auth-section" class="section">
        <div class="auth-box">
            <h2>Connexion</h2>
            <form action="#" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Mot de passe:</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" class="submit-btn cta-button">Se connecter</button>
            </form>
            <p class="auth-footer">Pas encore de compte ? <a href="sign_up.html">Inscrivez-vous ici.</a></p>
        </div>
    </section>
</body>
</html>
