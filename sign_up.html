      <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'inscrire | Orientation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="section">
        <div class="header-container">
            <h1 class="logo">ORIENTATION</h1>
        </div>
    </header>
    <section id="auth-section" class="section">
        <div class="auth-box">
            <h2>Créer un compte</h2>
            <form action="#" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="signup-firstName">Prénom:</label>
                    <input type="text" id="signup-firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="signup-lastName">Nom:</label>
                    <input type="text" id="signup-lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="signup-grade">Classe/Niveau scolaire:</label>
                    <select id="signup-grade" name="schoolGrade" required>
                        <option value="">Sélectionner...</option>
                        <option value="terminale">Terminale (Bac)</option>
                        <option value="premiere">Première</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email:</label>
                    <input type="email" id="signup-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Mot de passe:</label>
                    <input type="password" id="signup-password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="signup-confirm">Confirmer mot de passe:</label>
                    <input type="password" id="signup-confirm" name="confirmPassword" required>
                </div>
                <button type="submit" class="submit-btn cta-button">S'inscrire</button>
            </form>
            <p class="auth-footer">Déjà un compte ? <a href="log_in.html">Connectez-vous.</a></p>
        </div>
    </section>
</body>
</html>
